name: Tests

on:
  push:
    branches: [main, cursor/**]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure git for tests
        run: |
          git config --global user.email "ci@test.local"
          git config --global user.name "CI Test"

      - name: Run unit tests
        run: |
          python3 -m pytest tests/test_tracing_context.py -v --tb=short

      - name: Run tests with unittest (fallback)
        if: failure()
        run: |
          python3 tests/test_tracing_context.py -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Check formatting
        run: ruff check .kiro/hooks/ tests/ --select=E,F,W --ignore=E501
        continue-on-error: true

  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          python3 -c "
          import json
          from pathlib import Path
          
          errors = []
          for p in Path('.').rglob('*.json'):
              if '.git' in str(p):
                  continue
              try:
                  json.loads(p.read_text())
                  print(f'✓ {p}')
              except json.JSONDecodeError as e:
                  errors.append(f'{p}: {e}')
                  print(f'✗ {p}: {e}')
          
          if errors:
              raise SystemExit(1)
          "
